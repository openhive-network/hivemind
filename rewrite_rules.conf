rewrite ^/version /rpc/get_version break;
# endpoint for get /version

rewrite ^/sync-status /rpc/get_sync_status break;
# endpoint for get /sync-status

rewrite ^/posts/([^/]+)/([^/]+)/votes /rpc/get_post_votes?author=$1&permlink=$2 break;
# endpoint for get /posts/{author}/{permlink}/votes

rewrite ^/blog/votes /rpc/get_votes break;
# endpoint for get /blog/votes

rewrite ^/blog/reblogs /rpc/get_reblogs break;
# endpoint for get /blog/reblogs

rewrite ^/accounts/([^/]+)/votes /rpc/get_account_votes?account-name=$1 break;
# endpoint for get /accounts/{account-name}/votes

rewrite ^/accounts/([^/]+)/relationships /rpc/get_account_relationships?account-name=$1 break;
# endpoint for get /accounts/{account-name}/relationships

rewrite ^/accounts/([^/]+)/pending-curation-rewards /rpc/get_account_pending_curation_rewards?account-name=$1 break;
# endpoint for get /accounts/{account-name}/pending-curation-rewards

rewrite ^/accounts/([^/]+)/pending-author-rewards /rpc/get_account_pending_author_rewards?account-name=$1 break;
# endpoint for get /accounts/{account-name}/pending-author-rewards

rewrite ^/accounts/([^/]+)/operations /rpc/get_ops_by_account?account-name=$1 break;
# endpoint for get /accounts/{account-name}/operations

rewrite ^/(.*)$ /rpc/home break;
# endpoint for json-rpc 2.0
