---
  test_name: Hivemind

  marks:
    - patterntest
    

  includes:
    - !include ../../../common.yaml

  stages:
    - name: test
      request:
        url: "{service.proto:s}://{service.server:s}:{service.port}/"
        method: POST
        headers:
          content-type: application/json
        json:
          jsonrpc: "2.0"
          id: 1
          method: "bridge.get_ranked_posts_v2"
          params: {"sort":"created","tag":"life", "start_author":"ladenlabel","start_permlink":"water-liberty-bringing-it-back-to-its-primordial-clean-and-pristine-state", "limit":2, "truncate_body": 100}
      response:
        status_code: 200
        verify_response_with:
          function: validate_response:compare_response_with_pattern
          extra_kwargs:
            ignore_tags: "<bridge posts>"
