---
  test_name: Hivemind

  marks:
    - patterntest
    

  includes:
    - !include ../../common.yaml

  stages:
    - name: test
      request:
        url: "{service.proto:s}://{service.server:s}:{service.port}/"
        method: POST
        headers:
          content-type: application/json
        json:
          jsonrpc: "2.0"
          id: 1
          method: "bridge.get_posts"
          params: {"posts": [["xeroc", "piston-web-first-open-source-steem-gui---searching-for-alpha-testers"], ["dollarvigilante", "jubilee-jolt-dow-down-400-stocks-smashed-in-biggest-drop-since-brexit"], ["nonexistent-acct", "nope"]], "observer": "smooth", "top_votes": 2}
      response:
        status_code: 200
        verify_response_with:
          function: validate_response:compare_response_with_pattern
          extra_kwargs:
            ignore_tags: "<bridge posts>"
