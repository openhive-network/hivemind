---
  test_name: Hivemind

  marks:
    - patterntest

  includes:
    - !include ../../common.yaml

  stages:
    - name: test
      request:
        url: "{service.proto:s}://{service.server:s}:{service.port}/rpc/get_account_posts"
        method: GET
        headers:
          accept: application/json
        params:
          account-name: "alice"
          sort: "posts"
          community: "hive-171487"
          start-author: "alice"
          start-permlink: "Second-after-member-post-hive1"
          limit: 2
      response:
        status_code: 200
        verify_response_with:
          function: validate_response:compare_rest_response_with_pattern
          extra_kwargs:
            ignore_tags: "<bridge posts>"
