---
  test_name: Hivemind

  marks:
    - patterntest

  includes:
    - !include ../../common.yaml

  stages:
    - name: test
      request:
        url: "{service.proto:s}://{service.server:s}:{service.port}/rpc/get_post_discussion"
        method: GET
        headers:
          accept: application/json
        params:
          author: "gtg"
          permlink: "missing-rewards-while-mining"
          votes: "summary"
      response:
        status_code: 200
        verify_response_with:
          function: validate_response:compare_rest_response_with_pattern
          extra_kwargs:
            ignore_tags: "<bridge discussion>"
