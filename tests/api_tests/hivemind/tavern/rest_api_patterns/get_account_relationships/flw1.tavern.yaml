---
  test_name: Hivemind

  marks:
    - patterntest

  includes:
    - !include ../../common.yaml

  stages:
    - name: test
      request:
        url: "{service.proto:s}://{service.server:s}:{service.port}/rpc/get_account_relationships"
        method: POST
        headers:
          content-type: application/json
          accept: application/json
        json:
          account-name: "flw1"
          accounts: "flw3,flw6,flw7,flw8,flw9,flw2,flw3"
      response:
        status_code: 200
        verify_response_with:
          function: validate_response:compare_rest_response_with_pattern
