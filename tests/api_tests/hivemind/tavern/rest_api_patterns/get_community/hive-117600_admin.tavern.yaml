        headers:
          accept: application/json
        params:
          name: "hive-117600"
          observer: "good-karma"
      response:
        status_code: 200
        verify_response_with:
          function: validate_response:compare_rest_response_with_pattern
          extra_kwargs:
            ignore_tags: "<bridge community>"
