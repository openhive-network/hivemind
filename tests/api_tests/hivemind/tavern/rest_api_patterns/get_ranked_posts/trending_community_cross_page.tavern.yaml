---
  test_name: Hivemind

  marks:
    - patterntest

  includes:
    - !include ../../common.yaml

  stages:
    - name: test
      request:
        url: "{service.proto:s}://{service.server:s}:{service.port}/rpc/get_ranked_posts"
        method: GET
        headers:
          accept: application/json
        params:
          sort: "trending"
          tag: "hive-135485"
          start-author: "test-creator"
          start-permlink: "pinpost3"
          limit: 10
      response:
        status_code: 200
        verify_response_with:
          function: validate_response:compare_rest_response_with_pattern
          extra_kwargs:
            ignore_tags: "<bridge posts>"
