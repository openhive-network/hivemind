---
# Regression test: `risman`'s one pending vote (block 5,000,021, 12 s before
# the 5,000,024 head) on guest4test1's post counts once, with a 0.001 HBD
# basis. While hive_accounts.id was HAF's id + 1, the endpoint read the
# votes of the neighbouring account and pinned count=0 here.
  test_name: Hivemind

  marks:
    - patterntest

  includes:
    - !include ../../common.yaml

  stages:
    - name: test
      request:
        url: "{service.proto:s}://{service.server:s}:{service.port}/rpc/get_account_pending_curation_rewards"
        method: POST
        headers:
          content-type: application/json
          accept: application/json
        json:
          account-name: "risman"
      response:
        status_code: 200
        verify_response_with:
          function: validate_response:compare_rest_response_with_pattern
