---
  test_name: Hivemind

  marks:
    - patterntest

  includes:
    - !include ../../common.yaml

  stages:
    - name: test
      request:
        url: "{service.proto:s}://{service.server:s}:{service.port}/rpc/get_account_followers"
        method: GET
        headers:
          accept: application/json
        params:
          account-name: "steemit"
          start: "steemlinks"
          limit: 3
      response:
        status_code: 200
        verify_response_with:
          function: validate_response:compare_rest_response_with_pattern
