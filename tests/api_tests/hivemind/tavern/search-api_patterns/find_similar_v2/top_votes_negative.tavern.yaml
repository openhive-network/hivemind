---
  test_name: Hivemind

  marks:
    - patterntest
    - negative

  includes:
    - !include ../../common.yaml

  stages:
    - name: test
      request:
        url: "{service.proto:s}://{service.server:s}:{service.port}/"
        method: POST
        headers:
          content-type: application/json
        json:
          jsonrpc: "2.0"
          id: 1
          method: "search-api.find_similar_v2"
          params: {"author": "xeroc", "permlink": "piston-web-first-open-source-steem-gui---searching-for-alpha-testers", "top_votes": -1}
      response:
        status_code: 200
        verify_response_with:
          function: validate_response:compare_response_with_pattern
          extra_kwargs:
            error_response: true
            ignore_tags: '<error timestamp>'
