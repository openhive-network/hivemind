---
  test_name: Hivemind

  marks:
    - patterntest

  includes:
    - !include ../../common.yaml

  stages:
    - name: test
      request:
        url: "{service.proto:s}://{service.server:s}:{service.port}/rpc/search_posts"
        method: GET
        headers:
          accept: application/json
        params:
          q: "hive"
          sort: "relevance"
          author: "kental"
          page-size: 2
          start-author: "kental"
          start-permlink: "secrets-of-the-beekeeper-subtlety-beekeeping-bees"
      response:
        status_code: 200
        verify_response_with:
          function: validate_response:compare_rest_response_with_pattern
          extra_kwargs:
            ignore_tags: "<bridge post>"
