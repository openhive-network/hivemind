---
  test_name: Hivemind

  marks:
    - patterntest
    

  includes:
    - !include ../../common.yaml

  stages:
    - name: test
      request:
        url: "{service.proto:s}://{service.server:s}:{service.port}/"
        method: POST
        headers:
          content-type: application/json
        json:
          jsonrpc: "2.0"
          id: 1
          method: "search-api.find_text"
          params: {"pattern":"hive", "sort":"created", "limit":3, "start_author":"alexbeyman", "start_permlink":"short-story-not-long-now-an-orphan-discovers-disturbing-secrets-about-his-brilliant-deceased-grandfather"}
      response:
        status_code: 200
        verify_response_with:
          function: validate_response:compare_response_with_pattern
          extra_kwargs:
            ignore_tags: "<bridge post>"
