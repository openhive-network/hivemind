# The service stack AIDEV starts for the slots that install hivemind (every suite in
# .aidev/project.yaml without `stack: false`): one HAF testnet database, empty — no
# hived, no block_log, the sleep_infinity maintenance script keeping PostgreSQL up,
# as HAfAH's AIDEV stack and its CI `.haf-instance-testnet` service run it.
#
# The checks run in the runtime image (.aidev/runtime/), which joins this stack's
# network and reaches the database as `haf`. They install the candidate's own SQL
# and schema into it (.aidev/run-checks.sh), so no hivemind image is built.
#
# HAF image: find_haf_image in .gitlab-ci.yml tracks HAF develop (the template's
# default UPSTREAM_BRANCH); this is the testnet image of HAF commit 17c8606f, the
# hive/haf#348 commit aidev/integration merged as 5b3c1a87 (same tree), with the
# control tables' TRUNCATE/REFERENCES/TRIGGER revoked from application roles.
# When CI's resolved HAF commit moves, bump this digest together with
# HAF_FIXTURE_COMMIT/_DIGEST in project.yaml (see README.md).
services:
  haf:
    image: registry.gitlab.syncad.com/hive/haf/testnet@sha256:c5f87ee2254246e31266132fe923e6b56af6438d4eaecbfa44f84d58c449df30
    command: ["--execute-maintenance-script=/home/hived/source/./scripts/maintenance-scripts/sleep_infinity.sh"]
    environment:
      PGCTLTIMEOUT: "600"
      # Every role the checks connect as (haf_admin, hivemind, hivemind_user), from
      # anywhere on the stack network. Test-grade: the database is throwaway.
      PG_ACCESS: |
        host    all              all              0.0.0.0/0    trust
    healthcheck:
      # Healthy once hive_fork_manager is installed and the server accepts TCP
      # connections the way the checks make them.
      test: ["CMD-SHELL", "psql -h 127.0.0.1 -U haf_admin -d haf_block_log -Atc \"select 1 from pg_extension where extname = 'hive_fork_manager'\" | grep -qx 1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
