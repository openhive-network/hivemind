# Profile for hive/hivemind, written by `aidev project scaffold` (#13561).
#
# Schema reference: docs/architecture/project-profile.md
# Onboarding procedure: the `onboard-external-project` skill.
# Guide: docs/operations/onboarding-an-external-project.md
#
# The generator writes a starting point, not a governed answer: every
# binding below is the command a maintainer said this project runs, and it
# is reviewed and edited like any other declaration.
version: 2
project: hivemind

gitlab:
  host: "gitlab.syncad.com"
  path: "hive/hivemind"
  id: 213

# AIDEV integrates into its own branch; people merge it into develop through
# merge requests (as in hive/HAfAH and hive/haf), so `stable` is omitted and
# `aidev release` never moves develop or master.
branches:
  integration: "aidev/integration"
  # Integration reaches develop only by merge request gated by the project CI (aidev handoff).
  handoff: develop

# How this project's suites execute (#13892): one kind, stated once.
environment:
  kind: "container"
  # Built by .aidev/runtime/build.sh from .aidev/runtime/Dockerfile and setup.cfg
  # (its install_requires are baked in). sandbox.shared.hivemind's
  # HIVEMIND_RUNTIME_IMAGE pins the same image: re-pin both together.
  image: "registry.gitlab.syncad.com/hive/hivemind/aidev-tests@sha256:e561b4ce2695e9f6878d35a4284e7f88169b35d42f71d6cba1cc08861de40b13"
  inputs: [".aidev/runtime/Dockerfile", "setup.cfg"]

issues:
  intake_label: todo
  taxonomy: ".aidev/labels.yaml"
  decompose:
    # `never` is where an external project starts: nothing marks work
    # approved on this project's behalf until there is a track record.
    auto_todo: never
  # Reports about this project's work are filed against this project.
  watcher_reports: self

# The service stack the slots that install hivemind start (aidev#9890): one empty
# HAF testnet database. The runtime container joins its network and reaches it as
# `haf`; the candidate's own SQL and schema (with the reputation_tracker and HAfAH
# submodules it installs on) go into it through .aidev/run-checks.sh, so no
# hivemind image is built. Slots that only run unit tests say `stack: false`.
#
# The shared synced hivemind (`shared.hivemind`): HAF's 5M replay with hivemind
# installed, mocked and synced as CI's `sync` job does, one frozen template per
# schema revision, a copy-on-write clone per run. A dedicated session hosts it
# (`aidev session create hivemind-shared … --shared-service hivemind`), and this
# project's own `tavern` step consumes it (`external`). While no session serves
# it, AIDEV refuses the slots that start the stack by name.
# See .aidev/README.md.
sandbox:
  compose: .aidev/test-stack.compose.yml
  # One idle PostgreSQL 18 (about 0.9 GB resident, nothing replayed).
  resource_class: light
  services: [haf]
  readiness_timeout: 300
  env:
    HIVEMIND_TEST_DB_HOST: haf
  shared:
    hivemind:
      compose: ".aidev/shared-hivemind.compose.yml"
      services: [hivemind, seeder]
      ports: [pg]
      # The first start of a HAF commit copies its replayed cluster onto the dataset.
      readiness_timeout: 1800
      env:
        # hive/haf/fixture-5m:<commit> (hive/haf CI's build_haf_fixture_image) for the
        # HAF commit hivemind tests against: the one test-stack.compose.yml's testnet
        # image is pinned to. It follows hivemind's own HAF, not hive/haf's
        # sandbox.shared.haf pin, so the two may differ. Move it with that image.
        HAF_FIXTURE_COMMIT: "ce11487825c0fff3a22f145920f4d01133ab06ae"
        HAF_FIXTURE_DIGEST: "sha256:6dc0af433c773a56b59f47624f0067b6f72ed0b6c58525ee70589827cf81bd08"
        HIVEMIND_SHARED_DATA_ROOT: "/haf-pool/aidev-shared-hivemind"
        HIVEMIND_RUNTIME_IMAGE: "registry.gitlab.syncad.com/hive/hivemind/aidev-tests@sha256:e561b4ce2695e9f6878d35a4284e7f88169b35d42f71d6cba1cc08861de40b13"
        HIVEMIND_SHARED_SEED_REFS: "develop aidev/integration"
  external:
    - name: hivemind             # AIDEV_EXTERNAL_HIVEMIND_HOST / _PORT
      provider: "hivemind/hivemind"

# Verification slots. Each binding is what this project genuinely runs for
# that slot — never one selection repeated under seven names, which makes
# seven gates report on the same evidence while claiming to check seven
# different things.
#
# Lightweight first: the Python unit tests and ruff, then install / reinstall of the
# candidate into an empty HAF testnet database and a PostgREST JSON-RPC smoke
# test. `full` adds CI's tavern pattern suites against a clone of the shared
# synced hivemind (skipped, named, while no fixture matches the tree's schema
# revision); see .aidev/README.md.
verification:
  quick:
    adapter: command
    args: [".aidev/run-checks.sh", "quick", "unit", "ruff"]
    stack: false
    artifacts: ["test-results/quick/"]
  full:
    adapter: command
    args: [".aidev/run-checks.sh", "full", "unit", "ruff", "install", "reinstall", "mock-wrapper", "api-smoke", "tavern"]
    artifacts: ["test-results/full/"]
  baseline:
    adapter: command
    args: [".aidev/run-checks.sh", "baseline", "install", "reinstall", "api-smoke"]
    artifacts: ["test-results/baseline/"]
  canary:
    adapter: command
    args: [".aidev/run-checks.sh", "canary", "unit", "ruff", "install", "reinstall", "mock-wrapper", "api-smoke"]
    artifacts: ["test-results/canary/"]
  # There is no coverage tooling in the image yet; `coverage` runs the unit tests
  # (AIDEV runs it in the post-implementation scan only). `static` and `system`
  # are left unbound: AIDEV runs neither for a project.
  coverage:
    adapter: command
    args: [".aidev/run-checks.sh", "coverage", "unit"]
    stack: false
    artifacts: ["test-results/coverage/"]

# Quality evaluation (#14454): hivemind is largely unannotated, so AIDEV's own
# typecheck collector (mypy --strict on every changed file) would refuse any change
# to untyped code. The project's typecheck is mypy at its default strictness
# instead — unannotated functions aren't checked — through .aidev/mypy_sarif.py,
# which prints SARIF. Findings on lines a change doesn't touch are advisory.
quality:
  commands:
    - name: mypy
      replaces: [typecheck]
      format: sarif
      adapter: command
      args: ["python3", ".aidev/mypy_sarif.py", "hive"]

# Production-traffic replay (aidev docs/operations/traffic-replay.md): `aidev replay
# ab` replays the capture's hivemind calls against a full-scale haf_api_node, base
# build against candidate. The target node is operator configuration, kept out of
# this public repository: pass it with `--profile FILE` (aidev#15922), a copy of
# this `replay:` mapping with a `target:` added. For steem-20's
# /haf-pool/syncad/haf_api_node that target holds:
#   build_env: HIVEMIND_VERSION    (selects hivemind, hivemind-install and the rewriter's images)
#   services: [hivemind-install, hivemind-block-processing, hivemind-postgrest-server, hivemind-postgrest-rewriter]
#   endpoint: http://127.0.0.1:17002   (hivemind-postgrest-rewriter, as seen from the host)
#   freeze: {service: haf, env: ARGUMENTS, value: "--skip-hived"}
#   database: {container: haf-haf-1, name: haf_block_log, user: haf_admin,
#              schemas: [hivemind_app, hivemind_endpoints, hivemind_postgrest_utilities]}
#   rest_prefix: /hivemind-api     (a target key: the loader refuses it at this level)
# See .aidev/README.md, "Production-traffic replay".
performance:
  mode: observe
  replay:
    mode: observe
    # api.hive.blog 2026-10-16, 15 min between drone and haproxy on the hivemind
    # backend: what drone forwards to hivemind (translated, unbatched, cache misses
    # only), 173,075 requests. The 2025-11-22 haproxy capture (583b0d0d…) holds only
    # hived and hafah calls, none of hivemind's.
    captures: [8d7e6cb73d0843b9c169468a0f2dc1318f7a07afb0bada30688a3faa7f5a18d2]
    # Every method hive/db/sql_scripts/postgrest/utilities/get_api_method.sql
    # dispatches. condenser_api and database_api are named one by one: the rest of
    # both namespaces is hived's (and condenser_api.get_account_history & co. hafah's).
    methods:
      - "bridge.*"
      - condenser_api.get_follow_count
      - condenser_api.get_reblogged_by
      - condenser_api.get_trending_tags
      - condenser_api.get_state
      - condenser_api.get_account_reputations
      - condenser_api.get_blog
      - condenser_api.get_blog_entries
      - condenser_api.get_content
      - condenser_api.get_content_replies
      - condenser_api.get_followers
      - condenser_api.get_following
      - condenser_api.get_active_votes
      - condenser_api.get_discussions_by_blog
      - condenser_api.get_discussions_by_feed
      - condenser_api.get_discussions_by_author_before_date
      - condenser_api.get_discussions_by_comments
      - condenser_api.get_replies_by_last_update
      - condenser_api.get_discussions_by_created
      - condenser_api.get_discussions_by_hot
      - condenser_api.get_discussions_by_trending
      - condenser_api.get_post_discussions_by_payout
      - condenser_api.get_comment_discussions_by_payout
      - condenser_api.get_account_votes
      - "follow_api.*"
      - "tags_api.*"
      - database_api.find_votes
      - database_api.list_votes
      - database_api.find_comments
      - "hive.*"
      - "search-api.*"
      - "search_api.*"
      - "rest:/hivemind-api/*"
    normalise: {jsonrpc: drone}
    budgets:
      timeout_ms: 5000
      p95_ms: 2000
      max_timeout_rate: 0.001
      max_error_rate: 0.01
      regression_ratio: 1.25
      min_regression_ms: 5
      min_ok_share: 0.95
      max_consistent_error_rate: 0.05
    expected:
      - name: find-text-start-paging
        methods: [search-api.find_text, search_api.find_text]
        params: [start_author, start_permlink]
        reason: find_text now resumes after the start post; before #381 a start_author/start_permlink request returned page one or an empty page
    rules:
      # find_text's response carries no score, so no rule can confine this to posts of
      # equal score, and `params` tests parameter names, not `sort`'s value. The page
      # is compared as a multiset instead: a reordering is absorbed, a different post
      # on the page is not.
      - name: find-text-relevance-ties
        methods: [search-api.find_text, search_api.find_text]
        unordered: [result]
        reason: "#381 orders relevance ties by id DESC; before it their order was the plan's"
      - name: hivemind-info-reports-build
        methods: [hive.get_info]
        ignore:
          - result.hivemind_version
          - result.hivemind_git_rev
          - result.hivemind_git_date
          - result.database_patch_date
          - result.database_patched_to_revision
          - result.database_schema_version
        reason: hive.get_info reports the running build and the schema patch it installed
    # `aidev replay pairs`: each REST endpoint that wraps a JSON-RPC method, as
    # MAPPINGS in tests/api_tests/hivemind/tavern/rest_checks/equivalence.py states it;
    # change the two together. Paths are under target.rest_prefix (/hivemind-api).
    # Every endpoint answers the method's whole result, so no pair needs a
    # result_path or volatile: the list endpoints return the list's elements as
    # rows, which PostgREST sends as the same JSON array. A list method's `null`
    # result is a REST `[]` (no rows) by design (#383); such a call is reported as
    # differing, `null` against `[]`, and is no defect.
    # A pair maps the form the capture uses: named params for bridge and find_text,
    # positional for condenser_api. A call in the other form (bridge.get_post as
    # [author, permlink], a [{…}]-wrapped object) is skipped as unmapped:0 rather
    # than declared as a second pair, which would skip every named call instead.
    # Arguments with no REST parameter (truncate_body, include_own,
    # muted_reasons_filter) and a list `type` of account_notifications are skipped
    # as unmapped or not-scalar.
    pairs:
      - name: ranked-posts
        method: bridge.get_ranked_posts
        path: /posts
        query:
          sort: params.sort
          tag: params.tag
          page-size: params.limit
          start-author: params.start_author
          start-permlink: params.start_permlink
          observer: params.observer
      - name: account-posts
        method: bridge.get_account_posts
        path: /accounts/{params.account}/posts
        query:
          sort: params.sort
          community: params.community
          page-size: params.limit
          start-author: params.start_author
          start-permlink: params.start_permlink
          observer: params.observer
      - name: post
        method: bridge.get_post
        path: /posts/{params.author}/{params.permlink}
        query:
          observer: params.observer
      - name: account-profile
        method: bridge.get_profile
        path: /accounts/{params.account}/profile
        query:
          observer: params.observer
      - name: account-followers
        method: condenser_api.get_followers
        path: /accounts/{params.0}/followers
        query:
          start: params.1
          type: params.2
          page-size: params.3
      - name: account-following
        method: condenser_api.get_following
        path: /accounts/{params.0}/following
        query:
          start: params.1
          type: params.2
          page-size: params.3
      - name: account-notifications
        method: bridge.account_notifications
        path: /accounts/{params.account}/notifications
        query:
          type: params.type
          community: params.community
          min-score: params.min_score
          page-size: params.limit
          last-id: params.last_id
      - name: communities
        method: bridge.list_communities
        path: /communities
        query:
          sort: params.sort
          query: params.query
          page-size: params.limit
          last: params.last
          observer: params.observer
      - name: community
        method: bridge.get_community
        path: /communities/{params.name}
        query:
          observer: params.observer
      - name: community-subscribers
        method: bridge.list_subscribers
        path: /communities/{params.community}/subscribers
        query:
          last: params.last
          page-size: params.limit
      - name: community-roles
        method: bridge.list_community_roles
        path: /communities/{params.community}/roles
        query:
          last: params.last
          page-size: params.limit
      - name: search-posts
        method: search-api.find_text
        path: /search/posts
        query:
          q: params.pattern
          sort: params.sort
          author: params.author
          page-size: params.limit
          start-author: params.start_author
          start-permlink: params.start_permlink
          observer: params.observer
      - name: trending-tags
        method: bridge.get_trending_topics
        path: /tags/trending
        query:
          page-size: params.limit
          observer: params.observer
    inputs:
      - "hive/db/sql_scripts/**"
      - rewrite_rules.conf
      - docker/hivemind_nginx.conf.template
      - docker/rewriter_entrypoint.sh
      - Dockerfile.rewriter

# Commit trailers AIDEV asks the implementing agent to declare (aidev#15385).
# `Hivemind-Sync` tells CI's detect_changes whether the commit needs a full sync;
# scripts/ci/sync_decision.sh applies it behind path guards.
commit_trailers:
  - key: Hivemind-Sync
    values: [required, not-required]
    reason: required
    guidance: "CLAUDE.md#ci-sync-decision"

# Capability grants for target-side code. Empty until this project needs one.
capabilities: []
