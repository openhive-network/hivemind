# Profile for hive/hivemind, written by `aidev project scaffold` (#13561).
#
# Schema reference: docs/architecture/project-profile.md
# Onboarding procedure: the `onboard-external-project` skill.
# Guide: docs/operations/onboarding-an-external-project.md
#
# The generator writes a starting point, not a governed answer: every
# binding below is the command a maintainer said this project runs, and it
# is reviewed and edited like any other declaration.
version: 2
project: hivemind

gitlab:
  host: "gitlab.syncad.com"
  path: "hive/hivemind"
  id: 213

# AIDEV integrates into its own branch; people merge it into develop through
# merge requests (as in hive/HAfAH and hive/haf), so `stable` is omitted and
# `aidev release` never moves develop or master.
branches:
  integration: "aidev/integration"
  # Integration reaches develop only by merge request gated by the project CI (aidev handoff).
  handoff: develop

# How this project's suites execute (#13892): one kind, stated once.
environment:
  kind: "container"
  # The suites run in .aidev/runtime/Dockerfile built on common-ci-configuration's
  # python-test-tools:develop, the image CI's tool versions come from: AIDEV rebuilds it
  # when that tag moves or the Dockerfile or setup.cfg (its install_requires are baked
  # in) changes. `image` is only the seed pin AIDEV reads before a slot resolves: the
  # base's digest when hivemind started following it. See .aidev/README.md.
  image: "registry.gitlab.syncad.com/hive/common-ci-configuration/python-test-tools@sha256:6f7fb3acf0c4f5551cf9fa58a382fbae66c9c47b06510b31685553581ef1409e"
  inputs: [".aidev/runtime/Dockerfile", "setup.cfg"]
  build: {dockerfile: .aidev/runtime/Dockerfile, context: .}
  base: {image: "registry.gitlab.syncad.com/hive/common-ci-configuration/python-test-tools:develop", follow: true}

issues:
  intake_label: todo
  taxonomy: ".aidev/labels.yaml"
  decompose:
    # `never` is where an external project starts: nothing marks work
    # approved on this project's behalf until there is a track record.
    auto_todo: never
  # Reports about this project's work are filed against this project.
  watcher_reports: self

# The service stack the slots that install hivemind start (aidev#9890): one empty
# HAF testnet database. The runtime container joins its network and reaches it as
# `haf`; the candidate's own SQL and schema (with the reputation_tracker and HAfAH
# submodules it installs on) go into it through .aidev/run-checks.sh, so no
# hivemind image is built. Slots that only run unit tests say `stack: false`.
#
# The shared synced hivemind (`shared.hivemind`): HAF's 5M replay with hivemind
# installed, mocked and synced as CI's `sync` job does, one frozen template per
# schema revision, a copy-on-write clone per run. A dedicated session hosts it
# (`aidev session create hivemind-shared … --shared-service hivemind`), and this
# project's own `tavern` step consumes it (`external`). While no session serves
# it, AIDEV refuses the slots that start the stack by name.
# See .aidev/README.md.
sandbox:
  compose: .aidev/test-stack.compose.yml
  # One idle PostgreSQL 18 (about 0.9 GB resident, nothing replayed).
  resource_class: light
  services: [haf]
  readiness_timeout: 300
  env:
    HIVEMIND_TEST_DB_HOST: haf
  shared:
    hivemind:
      compose: ".aidev/shared-hivemind.compose.yml"
      services: [hivemind, seeder]
      ports: [pg]
      # The first start of a HAF commit copies its replayed cluster onto the dataset.
      readiness_timeout: 1800
      env:
        # hive/haf/fixture-5m:<commit> (hive/haf CI's build_haf_fixture_image) for the
        # HAF commit hivemind tests against: the one test-stack.compose.yml's testnet
        # image is pinned to. It follows hivemind's own HAF, not hive/haf's
        # sandbox.shared.haf pin, so the two may differ. Move it with that image.
        HAF_FIXTURE_COMMIT: "17c8606f2c78ae6c5783e1189d59031be2b43fbe"
        HAF_FIXTURE_DIGEST: "sha256:468c5b042c1f8eb9265eeccf66879e2a0cef79d2dd169c53ede1b84431561c41"
        HIVEMIND_SHARED_DATA_ROOT: "/haf-pool/aidev-shared-hivemind"
        # The seeder's image: hivemind's install_requires, psql and git (no test tool is
        # used). A build of .aidev/runtime/build.sh; see .aidev/README.md.
        HIVEMIND_RUNTIME_IMAGE: "registry.gitlab.syncad.com/hive/hivemind/aidev-tests@sha256:5e11cad742290640c091b2f054e7d2b4684fc406e6ad6af7c00e73b007074ac7"
        HIVEMIND_SHARED_SEED_REFS: "develop aidev/integration"
  external:
    - name: hivemind             # AIDEV_EXTERNAL_HIVEMIND_HOST / _PORT
      provider: "hivemind/hivemind"

# Verification slots. Each binding is what this project genuinely runs for
# that slot — never one selection repeated under seven names, which makes
# seven gates report on the same evidence while claiming to check seven
# different things.
#
# Lightweight first: the Python unit tests and ruff, then install / reinstall of the
# candidate into an empty HAF testnet database and a PostgREST JSON-RPC smoke
# test. `full` adds CI's tavern pattern suites against a clone of the shared
# synced hivemind (skipped, named, while no fixture matches the tree's schema
# revision), and `aidev db shape check` on the mainnet shape `performance.shape`
# pins (db_shape: host-side, it drives the host's Docker; `not applicable` when
# the diff cannot move a declared plan); see .aidev/README.md.
verification:
  quick:
    adapter: command
    args: [".aidev/run-checks.sh", "quick", "unit", "ruff"]
    stack: false
    artifacts: ["test-results/quick/"]
  full:
    suites:
      - name: checks
        adapter: command
        args: [".aidev/run-checks.sh", "full", "unit", "ruff", "install", "reinstall", "mock-wrapper", "api-smoke", "tavern"]
        artifacts: ["test-results/full/"]
      # After `checks`, which creates test-results/ (`--report` writes no directory).
      - name: db_shape
        adapter: command
        args: [aidev, db, shape, check, --report, test-results/db-shape-report.json]
        stack: false
        docker: true
        # The shape server held about 70 MiB through copies, installs and nested calls.
        memory: 2g
        mode: advisory
        reports: ["test-results/db-shape-report.json"]
  baseline:
    adapter: command
    args: [".aidev/run-checks.sh", "baseline", "install", "reinstall", "api-smoke"]
    artifacts: ["test-results/baseline/"]
  canary:
    adapter: command
    args: [".aidev/run-checks.sh", "canary", "unit", "ruff", "install", "reinstall", "mock-wrapper", "api-smoke"]
    artifacts: ["test-results/canary/"]
  # There is no coverage tooling in the image yet; `coverage` runs the unit tests
  # (AIDEV runs it in the post-implementation scan only). `static` and `system`
  # are left unbound: AIDEV runs neither for a project.
  coverage:
    adapter: command
    args: [".aidev/run-checks.sh", "coverage", "unit"]
    stack: false
    artifacts: ["test-results/coverage/"]

# Quality evaluation (#14454): hivemind is largely unannotated, so AIDEV's own
# typecheck collector (mypy --strict on every changed file) would refuse any change
# to untyped code. The project's typecheck is mypy at its default strictness
# instead — unannotated functions aren't checked — through .aidev/mypy_sarif.py,
# which prints SARIF. Findings on lines a change doesn't touch are advisory.
quality:
  commands:
    - name: mypy
      replaces: [typecheck]
      format: sarif
      adapter: command
      args: ["python3", ".aidev/mypy_sarif.py", "hive"]

# Production-traffic replay (aidev docs/operations/traffic-replay.md): `aidev replay
# ab` replays the capture's hivemind calls against a full-scale haf_api_node, base
# build against candidate. The target node is operator configuration, kept out of
# this public repository: pass it with `--profile FILE` (aidev#15922), a copy of
# this `replay:` mapping with a `target:` added. For steem-20's
# /haf-pool/syncad/haf_api_node that target holds:
#   build_env: HIVEMIND_VERSION    (selects hivemind, hivemind-install and the rewriter's images)
#   services: [hivemind-install, hivemind-block-processing, hivemind-postgrest-server, hivemind-postgrest-rewriter]
#   endpoint: http://127.0.0.1:17002   (hivemind-postgrest-rewriter, as seen from the host)
#   freeze: {service: haf, env: ARGUMENTS, value: "--skip-hived"}
#   database: {container: haf-haf-1, name: haf_block_log, user: haf_admin,
#              schemas: [hivemind_app, hivemind_endpoints, hivemind_postgrest_utilities]}
#   rest_prefix: /hivemind-api     (a target key: the loader refuses it at this level)
# See .aidev/README.md, "Production-traffic replay".
performance:
  mode: observe
  # A full-scale mainnet shape (aidev docs/operations/db-shape.md): the schema, sizes
  # and statistics of steem-20's haf_block_log, loaded into an empty Postgres, so
  # `aidev db shape check|plan|compare|hypo|apply` plan at production size.
  # Re-capture, and when to move the pin: .aidev/README.md, "The mainnet shape".
  shape:
    # haf-haf-1 on steem-20 at block 111,151,349, captured 2026-10-27 right after a
    # full replay from an empty database: 629 relations, 5,032 GiB, hivemind_app and
    # reptracker_app included. Published to the fleet store.
    artifact: 9381e39f59cbf62a2d6568f150dbeb4217714992cfe7e3d17e6a56bee7f19d92
    # Workflows may read it (explain --source, calibrate): read-only, two sessions at most.
    source: {host: steem-20.syncad.com, container: haf-haf-1, database: haf_block_log, user: haf_admin, workflow_access: true}
    # The image the source runs; it has the source's extensions (hive_fork_manager,
    # pg_cron, plpython3u, ...), so the shape loads completely.
    image: "registry.gitlab.syncad.com/hive/haf:17c8606f@sha256:0b9366e37b7674fba7f4ccb01d2fcdf44737aff23d60d3720c1a9e5edaf818e3"
    # The tree's database code as `hive upgrade_schema` puts it on an installed
    # database, streamed through $AIDEV_DB_SHAPE_PSQL; what it leaves out and why:
    # the script's docstring.
    apply: {command: [python3, .aidev/shape_apply.py]}
  # What can move a declared plan: the check is `not applicable` for a diff touching
  # none of these (or .aidev/project.yaml). An `apply` command reads files nobody
  # declared, so without this list every changed path but docs would count.
  inputs: ["hive/db/sql_scripts/**", "hive/db/schema.py", "scripts/install_app.sql", ".aidev/shape_apply.py"]
  # The plans `aidev db shape check` compares, base tree against candidate, with the
  # default plan budgets (max_cost_ratio 1.5, no new Seq Scan over 1 GiB); observe
  # only, no time assertions. See .aidev/README.md, "The mainnet shape".
  #
  # The API calls are the hottest methods of the replay capture below (`aidev replay
  # profile`): 11 methods, 94% of its 173,075 calls, each called through its
  # hivemind_endpoints entry function (`nested`, so every statement inside is
  # compared) with its most frequent real arguments. A shape's heaps are empty, so
  # each call's `setup` inserts the rows its guards look up (find_account_id,
  # find_comment_id, ...), with the source's ids so the statements after them plan
  # for real values; replica mode skips the foreign keys. The setup is rolled back
  # after the call.
  #
  # `parameters` name the skewed columns (an author with a million posts against
  # one with a few), so a capture run with `--queries .aidev/project.yaml`
  # catalogues their troublesome values. A parameter must appear in the query's
  # SQL, so the call reads the argument from the stub row the value keys (`(SELECT
  # name FROM hivemind_app.hive_accounts WHERE id = ${account})`). The pinned
  # capture holds no catalog yet, so each query is planned once, at its `value`.
  queries:
    # 40.9 calls/s. A 1,008-reply thread; `post` is the stub's id and root_id.
    - name: bridge-get-discussion
      sql: >-
        SELECT hivemind_endpoints.bridge_api_get_discussion(jsonb_build_object('author', 'leothreads', 'observer', 'hive.blog', 'permlink',
        (SELECT hpd.permlink FROM hivemind_app.hive_posts hp JOIN hivemind_app.hive_permlink_data hpd ON hpd.id = hp.permlink_id WHERE hp.id = ${post})))
      nested: true
      setup:
        - &replica SET session_replication_role = replica
        - &observer INSERT INTO hivemind_app.hive_accounts (id, name, created_at) VALUES (1371790, 'hive.blog', '2020-03-17 14:02:30')
        - &leothreads INSERT INTO hivemind_app.hive_accounts (id, name, created_at) VALUES (2410041, 'leothreads', '2022-07-19 14:36:33')
        - INSERT INTO hivemind_app.hive_permlink_data (id, permlink) VALUES (206192396, 'leothread-2026-10-11-15-16')
        - >-
          INSERT INTO hivemind_app.hive_posts (id, root_id, parent_id, author_id, permlink_id, category_id, community_id, created_at, depth, block_num, block_num_created)
          VALUES (${post}, ${post}, 0, 2410041, 206192396, 7893654, 1341662, '2026-10-11 15:16:36', 0, 110683704, 110683704)
      parameters:
        post: {column: hivemind_app.hive_posts.root_id, value: 142537575}
    # 31.5 calls/s.
    - name: bridge-get-post
      sql: >-
        SELECT hivemind_endpoints.bridge_api_get_post('{"author": "keys-defender", "permlink": "phishing-db"}'::jsonb)
      nested: true
      setup:
        - *replica
        - INSERT INTO hivemind_app.hive_accounts (id, name, created_at) VALUES (1359481, 'keys-defender', '2020-02-01 08:37:15')
        - INSERT INTO hivemind_app.hive_permlink_data (id, permlink) VALUES (136866300, 'phishing-db')
        - >-
          INSERT INTO hivemind_app.hive_posts (id, root_id, parent_id, author_id, permlink_id, category_id, community_id, created_at, depth, block_num, block_num_created)
          VALUES (94935271, 94869698, 94869698, 1359481, 136866300, 8358211, 1361897, '2021-03-20 04:22:51', 1, 103868895, 52290714)
    # 29.4 calls/s.
    - name: bridge-get-profile
      sql: >-
        SELECT hivemind_endpoints.bridge_api_get_profile(jsonb_build_object('observer', 'hive.blog', 'account',
        (SELECT name FROM hivemind_app.hive_accounts WHERE id = ${account})))
      nested: true
      setup:
        - *replica
        - *observer
        - INSERT INTO hivemind_app.hive_accounts (id, name, created_at) VALUES (${account}, 'ai-summaries', '2024-02-17 08:31:27')
      parameters:
        account: {column: hivemind_app.hive_posts.author_id, value: 2487558}
    # 24.7 calls/s.
    - name: condenser-get-follow-count
      sql: >-
        SELECT hivemind_endpoints.condenser_api_get_follow_count('["gtg"]'::jsonb)
      nested: true
      setup:
        - INSERT INTO hivemind_app.hive_accounts (id, name, created_at) VALUES (14008, 'gtg', '2016-06-30 17:22:18')
    # 16.1 calls/s (get_content_replies, 3.2 calls/s, below).
    - name: condenser-get-content
      sql: >-
        SELECT hivemind_endpoints.condenser_api_get_content('["tdvtv", "agenda-2030-is-rolling-out-live-the-real-twoparty-system-behind-the-curtain-tk3fxd3lp4"]'::jsonb, false, true)
      nested: true
      setup:
        - *replica
        - INSERT INTO hivemind_app.hive_accounts (id, name, created_at) VALUES (1425230, 'tdvtv', '2020-12-17 22:32:09')
        - INSERT INTO hivemind_app.hive_permlink_data (id, permlink) VALUES (206250954, 'agenda-2030-is-rolling-out-live-the-real-twoparty-system-behind-the-curtain-tk3fxd3lp4')
        - >-
          INSERT INTO hivemind_app.hive_posts (id, root_id, parent_id, author_id, permlink_id, category_id, community_id, created_at, depth, block_num, block_num_created)
          VALUES (142576883, 142576883, 0, 1425230, 206250954, 7919652, 1345317, '2026-10-15 14:19:33', 0, 110797390, 110797390)
    # 10.1 calls/s, 46% sort=posts (sbi-tokens' page alone 326 calls), 33% sort=blog.
    - name: bridge-get-account-posts-posts
      sql: >-
        SELECT hivemind_endpoints.bridge_api_get_account_posts(jsonb_build_object('sort', 'posts', 'limit', 10, 'account',
        (SELECT name FROM hivemind_app.hive_accounts WHERE id = ${author})))
      nested: true
      setup:
        - *replica
        - INSERT INTO hivemind_app.hive_accounts (id, name, created_at) VALUES (${author}, 'sbi-tokens', '2019-07-31 04:48:36')
      parameters:
        author: {column: hivemind_app.hive_posts.author_id, value: 1301538}
    - name: bridge-get-account-posts-blog
      sql: >-
        SELECT hivemind_endpoints.bridge_api_get_account_posts(jsonb_build_object('sort', 'blog', 'limit', 20, 'observer', 'hive.blog', 'account',
        (SELECT name FROM hivemind_app.hive_accounts WHERE id = ${blogger})))
      nested: true
      setup:
        - *replica
        - *observer
        - INSERT INTO hivemind_app.hive_accounts (id, name, created_at) VALUES (${blogger}, 'hiveio', '2020-03-06 12:22:48')
      parameters:
        blogger: {column: hivemind_app.hive_feed_cache.account_id, value: 1370485}
    # 7.9 calls/s.
    - name: bridge-get-community
      sql: >-
        SELECT hivemind_endpoints.bridge_api_get_community(jsonb_build_object('observer', 'hive.blog', 'name',
        (SELECT name FROM hivemind_app.hive_communities WHERE id = ${community})))
      nested: true
      setup:
        - *replica
        - *observer
        - INSERT INTO hivemind_app.hive_communities (id, type_id, name, created_at, block_num) VALUES (${community}, 1, 'hive-167922', '2019-11-26 17:25:27', 38518287)
      parameters:
        community: {column: hivemind_app.hive_posts.community_id, value: 1341662}
    # 6.4 calls/s; 45% ask for 1000 followers. appreciator has 18,071.
    - name: condenser-get-followers
      sql: >-
        SELECT hivemind_endpoints.condenser_api_get_followers(jsonb_build_array(
        (SELECT name FROM hivemind_app.hive_accounts WHERE id = ${account}), '', 'blog', 1000), true)
      nested: true
      setup:
        - INSERT INTO hivemind_app.hive_accounts (id, name, created_at) VALUES (${account}, 'appreciator', '2017-07-01 05:55:21')
      parameters:
        account: {column: hivemind_app.follows.following, value: 236847}
    # 6.3 calls/s; 40% ask for 1000. neoxian follows 5,314.
    - name: condenser-get-following
      sql: >-
        SELECT hivemind_endpoints.condenser_api_get_following(jsonb_build_array(
        (SELECT name FROM hivemind_app.hive_accounts WHERE id = ${account}), '', 'blog', 1000), true)
      nested: true
      setup:
        - INSERT INTO hivemind_app.hive_accounts (id, name, created_at) VALUES (${account}, 'neoxian', '2016-07-10 17:45:18')
      parameters:
        account: {column: hivemind_app.follows.follower, value: 16334}
    # 4.4 calls/s: 54% sort=trending (mostly the front page, tag ""), 26% sort=created
    # (lassecash's tag page alone 334 calls, all asking for 50, which is refused: the
    # declared call asks for the limit's maximum, 20).
    - name: bridge-get-ranked-posts-trending
      sql: >-
        SELECT hivemind_endpoints.bridge_api_get_ranked_posts('{"sort": "trending", "tag": "", "limit": 20, "observer": "hive.blog"}'::jsonb)
      nested: true
      setup:
        - *replica
        - *observer
    - name: bridge-get-ranked-posts-created-tag
      sql: >-
        SELECT hivemind_endpoints.bridge_api_get_ranked_posts(jsonb_build_object('sort', 'created', 'limit', 20, 'tag',
        (SELECT tag FROM hivemind_app.hive_tag_data WHERE id = ${tag})))
      nested: true
      setup:
        - *replica
        - INSERT INTO hivemind_app.hive_tag_data (id, tag) VALUES (${tag}, 'lassecash')
        - INSERT INTO hivemind_app.hive_category_data (id, category) VALUES (7299195, 'lassecash')
      parameters:
        tag: {column: hivemind_app.hive_post_tags.tag_id, value: 33109531}
    - name: condenser-get-content-replies
      sql: >-
        SELECT hivemind_endpoints.condenser_api_get_content(jsonb_build_array('leothreads',
        (SELECT hpd.permlink FROM hivemind_app.hive_posts hp JOIN hivemind_app.hive_permlink_data hpd ON hpd.id = hp.permlink_id WHERE hp.id = ${post})), true, true)
      nested: true
      setup:
        - *replica
        - *leothreads
        - INSERT INTO hivemind_app.hive_permlink_data (id, permlink) VALUES (206192396, 'leothread-2026-10-11-15-16')
        - >-
          INSERT INTO hivemind_app.hive_posts (id, root_id, parent_id, author_id, permlink_id, category_id, community_id, created_at, depth, block_num, block_num_created)
          VALUES (${post}, ${post}, 0, 2410041, 206192396, 7893654, 1341662, '2026-10-11 15:16:36', 0, 110683704, 110683704)
      parameters:
        post: {column: hivemind_app.hive_posts.parent_id, value: 142537575}
    # Initial sync finalization (recalculate_all_posts_votes_and_children, run once
    # after massive sync): the child-count SELECT it runs per depth level, deepest
    # first, and the hive_votes per-post aggregation its UPDATE reads. `depth` is the
    # loop variable; 1 is the largest level (47% of hive_posts).
    - name: finalize-child-count-per-depth
      sql: >-
        SELECT h1.parent_id AS queried_parent, SUM(COALESCE(pc.child_count, 0) + 1) AS count
        FROM hivemind_app.hive_posts h1
        LEFT JOIN hivemind_app.__post_children pc ON pc.id = h1.id
        WHERE (h1.parent_id != 0 OR ${depth} = 0) AND h1.counter_deleted = 0 AND h1.id != 0 AND h1.depth = ${depth}
        GROUP BY h1.parent_id
      parameters:
        depth: {column: hivemind_app.hive_posts.depth, value: 1}
    - name: finalize-votes-per-post
      sql: >-
        SELECT hv.post_id, SUM(hv.rshares) AS rshares, SUM(ABS(hv.rshares)) AS abs_rshares,
        SUM(CASE hv.is_effective WHEN True THEN 1 ELSE 0 END) AS total_votes,
        SUM(CASE WHEN hv.rshares > 0 THEN 1 WHEN hv.rshares = 0 THEN 0 ELSE -1 END) AS net_votes
        FROM hivemind_app.hive_votes hv
        GROUP BY hv.post_id
  replay:
    mode: observe
    # api.hive.blog 2026-10-16, 15 min between drone and haproxy on the hivemind
    # backend: what drone forwards to hivemind (translated, unbatched, cache misses
    # only), 173,075 requests. The 2025-11-22 haproxy capture (583b0d0d…) holds only
    # hived and hafah calls, none of hivemind's.
    captures: [8d7e6cb73d0843b9c169468a0f2dc1318f7a07afb0bada30688a3faa7f5a18d2]
    # Every method hive/db/sql_scripts/postgrest/utilities/get_api_method.sql
    # dispatches. condenser_api and database_api are named one by one: the rest of
    # both namespaces is hived's (and condenser_api.get_account_history & co. hafah's).
    methods:
      - "bridge.*"
      - condenser_api.get_follow_count
      - condenser_api.get_reblogged_by
      - condenser_api.get_trending_tags
      - condenser_api.get_state
      - condenser_api.get_account_reputations
      - condenser_api.get_blog
      - condenser_api.get_blog_entries
      - condenser_api.get_content
      - condenser_api.get_content_replies
      - condenser_api.get_followers
      - condenser_api.get_following
      - condenser_api.get_active_votes
      - condenser_api.get_discussions_by_blog
      - condenser_api.get_discussions_by_feed
      - condenser_api.get_discussions_by_author_before_date
      - condenser_api.get_discussions_by_comments
      - condenser_api.get_replies_by_last_update
      - condenser_api.get_discussions_by_created
      - condenser_api.get_discussions_by_hot
      - condenser_api.get_discussions_by_trending
      - condenser_api.get_post_discussions_by_payout
      - condenser_api.get_comment_discussions_by_payout
      - condenser_api.get_account_votes
      - "follow_api.*"
      - "tags_api.*"
      - database_api.find_votes
      - database_api.list_votes
      - database_api.find_comments
      - "hive.*"
      - "search-api.*"
      - "search_api.*"
      - "rest:/hivemind-api/*"
    normalise: {jsonrpc: drone}
    budgets:
      timeout_ms: 5000
      p95_ms: 2000
      max_timeout_rate: 0.001
      max_error_rate: 0.01
      regression_ratio: 1.25
      min_regression_ms: 5
      min_ok_share: 0.95
      max_consistent_error_rate: 0.05
    expected:
      - name: find-text-start-paging
        methods: [search-api.find_text, search_api.find_text]
        params: [start_author, start_permlink]
        reason: find_text now resumes after the start post; before #381 a start_author/start_permlink request returned page one or an empty page
    rules:
      # find_text's response carries no score, so no rule can confine this to posts of
      # equal score, and `params` tests parameter names, not `sort`'s value. The page
      # is compared as a multiset instead: a reordering is absorbed, a different post
      # on the page is not.
      - name: find-text-relevance-ties
        methods: [search-api.find_text, search_api.find_text]
        unordered: [result]
        reason: "#381 orders relevance ties by id DESC; before it their order was the plan's"
      - name: hivemind-info-reports-build
        methods: [hive.get_info]
        ignore:
          - result.hivemind_version
          - result.hivemind_git_rev
          - result.hivemind_git_date
          - result.database_patch_date
          - result.database_patched_to_revision
          - result.database_schema_version
        reason: hive.get_info reports the running build and the schema patch it installed
    # `aidev replay pairs`: each REST endpoint that wraps a JSON-RPC method, as
    # MAPPINGS in tests/api_tests/hivemind/tavern/rest_checks/equivalence.py states it;
    # change the two together. Paths are under target.rest_prefix (/hivemind-api).
    # Every endpoint answers the method's whole result, so no pair needs a
    # result_path or volatile: the list endpoints return the list's elements as
    # rows, which PostgREST sends as the same JSON array. A list method's `null`
    # result is a REST `[]` (no rows) by design (#383), so every pair whose endpoint
    # returns rows (`SETOF JSONB` via rest_json_rpc_rows) declares
    # `empty_equivalents: [null, []]`: such a call counts as equal, reported apart
    # as "of which N by empty_equivalents". The single-object pairs (post,
    # account-profile, community) declare none, so a `null`/`[]` there still differs.
    # A pair maps the form the capture uses: named params for bridge and find_text,
    # positional for condenser_api. A call in the other form (bridge.get_post as
    # [author, permlink], a [{…}]-wrapped object) is skipped as unmapped:0 rather
    # than declared as a second pair, which would skip every named call instead.
    # Arguments with no REST parameter (truncate_body, include_own,
    # muted_reasons_filter) and a list `type` of account_notifications are skipped
    # as unmapped or not-scalar.
    pairs:
      - name: ranked-posts
        method: bridge.get_ranked_posts
        path: /posts
        query:
          sort: params.sort
          tag: params.tag
          page-size: params.limit
          start-author: params.start_author
          start-permlink: params.start_permlink
          observer: params.observer
        empty_equivalents: [null, []]
      - name: account-posts
        method: bridge.get_account_posts
        path: /accounts/{params.account}/posts
        query:
          sort: params.sort
          community: params.community
          page-size: params.limit
          start-author: params.start_author
          start-permlink: params.start_permlink
          observer: params.observer
        empty_equivalents: [null, []]
      - name: post
        method: bridge.get_post
        path: /posts/{params.author}/{params.permlink}
        query:
          observer: params.observer
      - name: account-profile
        method: bridge.get_profile
        path: /accounts/{params.account}/profile
        query:
          observer: params.observer
      - name: account-followers
        method: condenser_api.get_followers
        path: /accounts/{params.0}/followers
        query:
          start: params.1
          type: params.2
          page-size: params.3
        empty_equivalents: [null, []]
      - name: account-following
        method: condenser_api.get_following
        path: /accounts/{params.0}/following
        query:
          start: params.1
          type: params.2
          page-size: params.3
        empty_equivalents: [null, []]
      - name: account-notifications
        method: bridge.account_notifications
        path: /accounts/{params.account}/notifications
        query:
          type: params.type
          community: params.community
          min-score: params.min_score
          page-size: params.limit
          last-id: params.last_id
        empty_equivalents: [null, []]
      - name: communities
        method: bridge.list_communities
        path: /communities
        query:
          sort: params.sort
          query: params.query
          page-size: params.limit
          last: params.last
          observer: params.observer
        empty_equivalents: [null, []]
      - name: community
        method: bridge.get_community
        path: /communities/{params.name}
        query:
          observer: params.observer
      - name: community-subscribers
        method: bridge.list_subscribers
        path: /communities/{params.community}/subscribers
        query:
          last: params.last
          page-size: params.limit
        empty_equivalents: [null, []]
      - name: community-roles
        method: bridge.list_community_roles
        path: /communities/{params.community}/roles
        query:
          last: params.last
          page-size: params.limit
        empty_equivalents: [null, []]
      - name: search-posts
        method: search-api.find_text
        path: /search/posts
        query:
          q: params.pattern
          sort: params.sort
          author: params.author
          page-size: params.limit
          start-author: params.start_author
          start-permlink: params.start_permlink
          observer: params.observer
        empty_equivalents: [null, []]
      - name: trending-tags
        method: bridge.get_trending_topics
        path: /tags/trending
        query:
          page-size: params.limit
          observer: params.observer
        empty_equivalents: [null, []]
    inputs:
      - "hive/db/sql_scripts/**"
      - rewrite_rules.conf
      - docker/hivemind_nginx.conf.template
      - docker/rewriter_entrypoint.sh
      - Dockerfile.rewriter

# Commit trailers AIDEV asks the implementing agent to declare (aidev#15385).
# `Hivemind-Sync` tells CI's detect_changes whether the commit needs a full sync;
# scripts/ci/sync_decision.sh applies it behind path guards.
commit_trailers:
  - key: Hivemind-Sync
    values: [required, not-required]
    reason: required
    guidance: "CLAUDE.md#ci-sync-decision"

# Capability grants for target-side code. Empty until this project needs one.
capabilities: []
